<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Risk Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .positive {
            background-color: #ffe5e5;
            color: #cc0000;
        }

        .negative {
            background-color: #e6ffed;
            color: #008a2e;
        }

        .loading {
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .disclaimer {
            font-size: 11px;
            color: gray;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Diabetes Risk Prediction</h2>

    <input id="pregnancies" placeholder="Pregnancies" type="number">
    <input id="glucose" placeholder="Glucose Level" type="number">
    <input id="bloodPressure" placeholder="Blood Pressure" type="number">
    <input id="skinThickness" placeholder="Skin Thickness" type="number">
    <input id="insulin" placeholder="Insulin Level" type="number">
    <input id="bmi" placeholder="BMI" type="number" step="0.1">
    <input id="diabetesPedigreeFunction" placeholder="Diabetes Pedigree Function" type="number" step="0.01">
    <input id="age" placeholder="Age" type="number">

    <button onclick="predict()">Predict Risk</button>

    <div class="loading" id="loading">🔄 Predicting...</div>
    <div id="result" class="result-box"></div>

    <div class="disclaimer">
        ⚠ This tool is for educational purposes only and not a medical diagnosis.
    </div>
</div>

<script>
async function predict() {

    const fields = [
        "pregnancies","glucose","bloodPressure","skinThickness",
        "insulin","bmi","diabetesPedigreeFunction","age"
    ];

    // Input Validation
    for (let field of fields) {
        if (document.getElementById(field).value === "") {
            alert("Please fill all fields.");
            return;
        }
    }

    const data = {
        pregnancies: parseFloat(pregnancies.value),
        glucose: parseFloat(glucose.value),
        bloodPressure: parseFloat(bloodPressure.value),
        skinThickness: parseFloat(skinThickness.value),
        insulin: parseFloat(insulin.value),
        bmi: parseFloat(bmi.value),
        diabetesPedigreeFunction: parseFloat(diabetesPedigreeFunction.value),
        age: parseInt(age.value)
    };

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").style.display = "none";

    try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        const probabilityPercent = (result.probability * 100).toFixed(2);

        const resultBox = document.getElementById("result");

        if (result.prediction === 1) {
            resultBox.innerHTML = 
                `⚠ High Risk of Diabetes <br> Probability: ${probabilityPercent}%`;
            resultBox.className = "result-box positive";
        } else {
            resultBox.innerHTML = 
                `✔ Low Risk of Diabetes <br> Probability: ${probabilityPercent}%`;
            resultBox.className = "result-box negative";
        }

        resultBox.style.display = "block";

    } catch (error) {
        alert("Error connecting to server. Make sure FastAPI is running.");
    }

    document.getElementById("loading").style.display = "none";
}
</script>

</body>
</html>
